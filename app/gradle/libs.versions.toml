[versions]
activityCompose            = "1.13.0"
agp                        = "9.5.0"
camerak                    = "1.2"
coil                       = "3.6.3"
composeBom                 = "2026.09.00"
composeMultiplatform       = "1.12.2"
coreKtx                    = "1.19.1"
credentials                = "1.6.0"
credentialsPlayServicesAuth = "1.6.0"
datastore                  = "1.3.0"
detekt                     = "2.0.0-alpha.6"
espressoCore               = "3.7.0"
googleid                   = "1.2.1"
junit                      = "4.13.2"
junitExt                   = "1.3.0"
koin                       = "4.2.2"
kotlin                     = "2.4.21"
kotlinxCoroutinesCore      = "1.11.0"
kotlinxDatetime            = "0.8.0"
kotlinxSerialization       = "1.12.0"
ktlint                     = "14.2.0"
ktor                       = "3.6.1"
lifecycle                  = "2.11.0"
lifecycleRuntimeKtx        = "2.11.0"
material3                  = "1.9.0"
materialIconsExtended      = "1.7.3"
mokoPermissions            = "0.20.1"
navigationCompose          = "2.10.0"
playServicesAuth           = "22.0.0"
qrose                      = "1.3.1"
sqldelight                 = "2.4.1"

[libraries]
components-resources       = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
foundation                 = { module = "org.jetbrains.compose.foundation:foundation",           version.ref = "composeMultiplatform" }
runtime                    = { module = "org.jetbrains.compose.runtime:runtime",                 version.ref = "composeMultiplatform" }
ui                         = { module = "org.jetbrains.compose.ui:ui",                           version.ref = "composeMultiplatform" }
ui-tooling-preview         = { module = "org.jetbrains.compose.ui:ui-tooling-preview",           version.ref = "composeMultiplatform" }
material3                  = { module = "org.jetbrains.compose.material3:material3",              version.ref = "material3" }
material-icons-extended    = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

androidx-core-ktx          = { group = "androidx.core",           name = "core-ktx",             version.ref = "coreKtx" }
androidx-activity-compose  = { group = "androidx.activity",       name = "activity-compose",     version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom       = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui        = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

junit                      = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit             = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core     = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

koin-core                  = { module = "io.insert-koin:koin-core",                 version.ref = "koin" }
koin-android-provider      = { module = "io.insert-koin:koin-android",              version.ref = "koin" }
insert-koin-koin-compose   = { module = "io.insert-koin:koin-compose",              version.ref = "koin" }
insert-koin-koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",   version.ref = "kotlinxCoroutinesCore" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

ktor-client-core                  = { group = "io.ktor", name = "ktor-client-core",                  version.ref = "ktor" }
ktor-client-content-negotiation   = { group = "io.ktor", name = "ktor-client-content-negotiation",   version.ref = "ktor" }
ktor-serialization-kotlinx-json   = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",   version.ref = "ktor" }
ktor-client-android               = { group = "io.ktor", name = "ktor-client-android",               version.ref = "ktor" }
ktor-client-darwin                = { group = "io.ktor", name = "ktor-client-darwin",                version.ref = "ktor" }
ktor-client-cio                   = { group = "io.ktor", name = "ktor-client-cio",                   version.ref = "ktor" }
ktor-client-js                    = { group = "io.ktor", name = "ktor-client-js",                    version.ref = "ktor" }

navigation-compose         = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

play-services-auth         = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
#noinspection LoginCredentials
androidx-credentials       = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
#noinspection LoginCredentials
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentialsPlayServicesAuth" }
#noinspection LoginCredentials
googleid                   = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coil-compose               = { module = "io.coil-kt.coil3:coil-compose",         version.ref = "coil" }
coil-network               = { module = "io.coil-kt.coil3:coil-network-ktor3",   version.ref = "coil" }
qrose                      = { module = "io.github.alexzhirkevich:qrose",        version.ref = "qrose" }
camerak-core               = { module = "io.github.kashif-mehmood-km:camerak",   version.ref = "camerak" }
camerak-qr                 = { module = "io.github.kashif-mehmood-km:qr_scanner_plugin", version.ref = "camerak" }
moko-permissions           = { module = "dev.icerock.moko:permissions-compose",  version.ref = "mokoPermissions" }

sqldelight-runtime                = { module = "app.cash.sqldelight:runtime",              version.ref = "sqldelight" }
sqldelight-coroutines-extensions  = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android         = { module = "app.cash.sqldelight:android-driver",        version.ref = "sqldelight" }
sqldelight-driver-native          = { module = "app.cash.sqldelight:native-driver",         version.ref = "sqldelight" }
sqldelight-driver-sqlite          = { module = "app.cash.sqldelight:sqlite-driver",         version.ref = "sqldelight" }
sqldelight-driver-web-worker      = { module = "app.cash.sqldelight:web-worker-driver",     version.ref = "sqldelight" }

[plugins]
android-application                = { id = "com.android.application",                  version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-library                    = { id = "com.android.library",                      version.ref = "agp" }
compose-desktop                    = { id = "org.jetbrains.compose",                    version.ref = "composeMultiplatform" }
detekt                             = { id = "dev.detekt",                               version.ref = "detekt" }
kotlin-compose                     = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-multiplatform               = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
kotlin-serialization               = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ktlint                             = { id = "org.jlleitschuh.gradle.ktlint",            version.ref = "ktlint" }
sqldelight                         = { id = "app.cash.sqldelight",                      version.ref = "sqldelight" }
