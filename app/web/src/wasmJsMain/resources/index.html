<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>IIITNR Inventory App</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        #compose-app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="compose-app"></canvas>
    <script src="web.js"></script>
    <script src="google-config.js"></script>
    <script>
            window.iiitnrGoogleSignIn = function () {
                return new Promise(function (resolve, reject) {
                    var clientId = window.iiitnrGoogleClientId || '';
                    if (!clientId) {
                        reject(new Error('Google client ID not configured'));
                        return;
                    }

                    var basePath = window.location.pathname.replace(/[^/]*$/, '');
                    var redirectUri = window.location.origin + basePath + 'oauth-callback.html';

                    function randomHex(bytes) {
                        var arr = new Uint8Array(bytes);
                        window.crypto.getRandomValues(arr);
                        var out = '';
                        for (var i = 0; i < arr.length; i++) {
                            out += ('0' + arr[i].toString(16)).slice(-2);
                        }
                        return out;
                    }
                    var nonce = randomHex(16);
                    var state = randomHex(16);

                    var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth' +
                        '?client_id=' + encodeURIComponent(clientId) +
                        '&redirect_uri=' + encodeURIComponent(redirectUri) +
                        '&response_type=id_token' +
                        '&scope=' + encodeURIComponent('openid email profile') +
                        '&nonce=' + encodeURIComponent(nonce) +
                        '&state=' + encodeURIComponent(state) +
                        '&prompt=select_account';

                    var width = 500;
                    var height = 600;
                    var left = Math.max(0, (window.screen.width - width) / 2);
                    var top = Math.max(0, (window.screen.height - height) / 2);
                    var popup = window.open(
                        authUrl,
                        'iiitnrGoogleSignIn',
                        'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top
                    );

                    if (!popup) {
                        reject(new Error('Popup was blocked. Please allow popups for this site and try again.'));
                        return;
                    }

                    var settled = false;
                    var pollTimer = null;

                    function cleanup() {
                        window.removeEventListener('message', onMessage);
                        if (pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    }

                    function onMessage(event) {
                        if (event.origin !== window.location.origin) {
                            return;
                        }
                        if (!event.data || event.data.type !== 'iiitnr-google-idtoken') {
                            return;
                        }
                        settled = true;
                        cleanup();
                        if (event.data.idToken) {
                            resolve(event.data.idToken);
                        } else {
                            reject(new Error(event.data.error || 'Google sign-in failed'));
                        }
                    }

                    window.addEventListener('message', onMessage);

                    pollTimer = setInterval(function () {
                        if (popup.closed && !settled) {
                            settled = true;
                            cleanup();
                            reject(new Error('Sign-in window was closed'));
                        }
                    }, 500);
                });
            };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
