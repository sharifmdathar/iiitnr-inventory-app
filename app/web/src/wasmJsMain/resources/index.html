<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIITNR Inventory App</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        #compose-app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="compose-app"></canvas>
    <script src="web.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
            window.iiitnrGoogleClientId = '';
            window.iiitnrGoogleSignIn = function () {
                return new Promise(function (resolve, reject) {
                    var clientId = window.iiitnrGoogleClientId || '';
                    if (!clientId) {
                        reject(new Error('Google client ID not configured'));
                        return;
                    }
                    if (!window.google || !window.google.accounts || !window.google.accounts.id) {
                        reject(new Error('Google Identity Services failed to load'));
                        return;
                    }
                    window.google.accounts.id.initialize({
                        client_id: clientId,
                        callback: function (resp) {
                            if (resp && resp.credential) {
                                resolve(resp.credential);
                            } else {
                                reject(new Error(resp && resp.error ? resp.error : 'Google sign-in was cancelled or failed'));
                            }
                        },
                    });
                    window.google.accounts.id.prompt();
                });
            };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
