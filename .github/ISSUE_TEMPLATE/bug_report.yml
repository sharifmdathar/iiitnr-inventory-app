name: Bug report
description: Report something broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Fill in what you can — the more reproducible, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where did it happen?
      options:
        - Web (browser)
        - Android app
        - Desktop app
        - iOS app
        - Multiple / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the About page.
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Screenshots, error messages, anything relevant.
