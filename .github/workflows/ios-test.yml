name: iOS (manual)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag to attach the XCFramework to (e.g. v1.18.1)"
        required: false
        type: string

jobs:
  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Build iOS XCFramework
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache :shared:assembleSharedReleaseXCFramework --parallel --build-cache

      - name: Zip XCFramework
        run: |
          mkdir -p ios-artifacts
          cd app/shared/build/XCFrameworks/release
          zip -r ../../../../../ios-artifacts/IIITNR-Inventory-App-iOS-shared.xcframework.zip shared.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release-xcframework
          path: ios-artifacts/IIITNR-Inventory-App-iOS-shared.xcframework.zip
          retention-days: 7

      - name: Attach to release
        if: ${{ inputs.tag_name != '' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ios-artifacts/IIITNR-Inventory-App-iOS-shared.xcframework.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-ios:
    name: iOS simulator tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Run iOS simulator tests
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache :shared:iosSimulatorArm64Test --parallel --build-cache
