name: Test iOS Build

on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build iOS XCFramework
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache :shared:assembleSharedReleaseXCFramework --parallel --build-cache
