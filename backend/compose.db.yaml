services:
  db:
    container_name: db
    image: docker.io/postgres:19.0-alpine
    restart: unless-stopped
    profiles:
      - main
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iiitnr_inventory
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql

  db-test:
    image: docker.io/postgres:19.0-alpine
    restart: unless-stopped
    profiles:
      - test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iiitnr_inventory_test
    ports:
      - '5432:5432'
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql

volumes:
  pgdata:
