services:
  caddy:
    image: docker.io/caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs
      - caddy_data:/data
      - caddy_config:/config
      - /srv/web:/srv/web:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/iiitnr_inventory
    expose:
      - '4000'
    userns: keep-id
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:4000/ready']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - app
    volumes:
      - ./uploads:/app/uploads

  db:
    image: docker.io/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: iiitnr_inventory
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d iiitnr_inventory']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:
  db_data:

networks:
  app:
    driver: bridge
